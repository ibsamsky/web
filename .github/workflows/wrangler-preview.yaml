name: Preview

on: [pull_request]

permissions:
  contents: read
  deployments: write
  pull-requests: write
  issues: write

jobs:
  preview:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6 # v1.0.0
        with:
          extra-conf: |
            experimental-features = nix-command flakes

      - name: Deploy preview
        run: |
          set -euo pipefail
          out_dir="$RUNNER_TEMP/wrangler-out"
          mkdir -p "$out_dir"
          export WRANGLER_OUTPUT_FILE_DIRECTORY="$out_dir"
          nix develop --command -- wrangler preview --name "pr-${{ github.event.pull_request.number }}" 2>&1 | tee "$RUNNER_TEMP/preview.log"

          env_file="$RUNNER_TEMP/preview.env"
          : > "$env_file"

          artifact="$(find "$out_dir" -maxdepth 1 -name 'wrangler-output-*.json' -print -quit)"
          if [ -n "$artifact" ]; then
            jq -r '
              select(.type == "preview")
              | {
                  PREVIEW_URL: .preview_urls[0],
                  PREVIEW_DEPLOYMENT_URL: .deployment_urls[0],
                  PREVIEW_NAME: .preview_name,
                  WORKER_NAME: .worker_name
                }
              | to_entries[]
              | "\(.key)=\(.value // empty)"
            ' "$artifact" > "$env_file"
          fi

          preview_url="$(grep '^PREVIEW_URL=' "$env_file" | cut -d= -f2- || true)"
          if [ -z "$preview_url" ]; then
            preview_url="$(grep -Eo 'https://[^[:space:]]+workers\.dev[^[:space:]]*' "$RUNNER_TEMP/preview.log" | head -n 1 || true)"
            if [ -z "$preview_url" ]; then
              echo "Failed to determine preview URL (no wrangler artifact, no URL in logs)"
              exit 1
            fi
            echo "PREVIEW_URL=$preview_url" >> "$env_file"
          fi

          if ! grep -q '^PREVIEW_NAME=.' "$env_file"; then
            echo "PREVIEW_NAME=pr-${{ github.event.pull_request.number }}" >> "$env_file"
          fi

          cat "$env_file" >> "$GITHUB_ENV"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      - name: Publish preview deployment and comment
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const previewUrl = process.env.PREVIEW_URL;
            const deploymentUrl = process.env.PREVIEW_DEPLOYMENT_URL;
            const previewName = process.env.PREVIEW_NAME;
            const workerName = process.env.WORKER_NAME;
            const prNumber = context.payload.pull_request.number;
            const headRef = process.env.GITHUB_HEAD_REF || context.ref;

            // GitHub Deployment (non-production), mirrors wrangler-action.
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: headRef,
              auto_merge: false,
              description: 'Cloudflare Workers Preview',
              required_contexts: [],
              environment: previewName,
              production_environment: false,
            });

            if (deployment.status === 201) {
              await github.rest.repos.createDeploymentStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                deployment_id: deployment.data.id,
                environment: previewName,
                environment_url: previewUrl,
                production_environment: false,
                description: 'Cloudflare Workers Preview',
                state: 'success',
                auto_inactive: false,
              });
            } else {
              core.warning('Creating GitHub Deployment failed');
            }

            const marker = '<!-- wrangler-preview -->';
            const content = `# Workers Preview Deployment\n\n| Name | Result |\n| --- | --- |\n| **Worker:** | ${workerName} |\n| **Preview:** | ${previewName} |\n| **Preview URL:** | ${previewUrl} |\n| **Unique Deployment URL:** | ${deploymentUrl || 'N/A'} |\n`;
            await core.summary.addRaw(content).write();

            const body = `${marker}\n${content}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }
